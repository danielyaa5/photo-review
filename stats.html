<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savings · Photo Review</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  :root {
    --bg: #f5f5f2; --card: #ffffff; --fg: #1b1b1d; --muted: #6a6a70; --line: #e1e1dc;
    --accent: #0a62d0; --danger: #c22f28;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517; --card: #212124; --fg: #f1f1f2; --muted: #9b9ba2; --line: #34343a;
      --accent: #63a6ff; --danger: #ff6a60;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  a { color: var(--accent); }
  .page { max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 28px; height: 28px; }
  button { font: inherit; font-size: 13px; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 3px 9px; white-space: nowrap; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .6; cursor: default; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; display: none; max-width: 80vw; }
  h2 { margin: 30px 0 8px; font-size: 16px; }
  .muted { color: var(--muted); }

  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; margin-top: 16px; }
  .hero .label { color: var(--muted); }
  .hero .value { font-size: 52px; font-weight: 650; line-height: 1.15; letter-spacing: -.5px; }
  .hero .note { color: var(--muted); max-width: 70ch; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 13px; }
  .tile .value { font-size: 26px; font-weight: 650; }
  .tile .note { color: var(--muted); font-size: 13px; }

  .scroll { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; border-top: 0; white-space: nowrap; }
  td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name { min-width: 170px; max-width: 320px; overflow-wrap: anywhere; }
  td.when { white-space: nowrap; color: var(--muted); }
  td.result { min-width: 130px; }
  .outcome { font-weight: 600; white-space: nowrap; }
  .outcome.skipped, .outcome.cancelled { font-weight: 400; }
  .reason { font-size: 13px; max-width: 260px; }
  tr.unfinished td { color: var(--muted); }
  tr.unfinished td.name, tr.unfinished .outcome { color: var(--fg); }
  .caption { margin: -4px 0 8px; }
  td.sizes { white-space: nowrap; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 22px; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<div class="page">
  <div class="top"><h1><img src="/icon.svg" alt="">Savings and history</h1><a href="/">Back to the library</a></div>
  <div id="content"><p class="muted">Loading…</p></div>
</div>
<div id="toast" role="status"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
function toast(message) {
  $("toast").textContent = message;
  $("toast").style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => ($("toast").style.display = "none"), 5000);
}
// Shows one library item in the Photos app.
async function openInPhotos(id) {
  let result;
  try {
    const response = await fetch("/api/reveal", { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    if (response.status === 403) return location.reload();  // the app was restarted; this page is stale
    result = await response.json();
  } catch (error) {
    result = { ok: false, error: "Photo Review isn't responding." };
  }
  if (!result.ok) toast("Couldn't open it in Photos: " + result.error);
}
// Asks Photos to delete the original of a finished shrink. macOS shows its own confirmation first.
async function deleteOriginal(event, button) {
  button.disabled = true;
  button.textContent = "Confirm in the Photo Review dialog…";
  let result;
  try {
    const response = await fetch("/api/delete", { method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify({ ids: [event.assetId] }) });
    if (response.status === 403) return location.reload();  // the app was restarted; this page is stale
    result = await response.json();
  } catch (error) {
    result = { ok: false, error: "Photo Review isn't responding." };
  }
  if (result.ok) {
    toast(`Moved the original of ${event.name} (${size(event.originalBytes)}) to Recently Deleted.`);
  } else {
    toast(result.error || "Nothing was deleted.");
    button.disabled = false;
    button.textContent = "Delete original";
  }
  refresh();
}
function photosButton(label, id) {
  const button = el("button", { textContent: label });
  button.onclick = () => openInPhotos(id);
  return button;
}
function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}
function size(bytes) {
  const b = Math.abs(bytes);
  if (b >= 1e9) return (b / 1e9).toFixed(2) + " GB";
  if (b >= 1e6) return Math.round(b / 1e6) + " MB";
  return (b > 0 ? Math.max(1, Math.round(b / 1e3)) : 0) + " KB";
}
function span(seconds) {
  if (seconds < 90) return Math.round(seconds) + " sec";
  const minutes = Math.round(seconds / 60);
  return minutes < 60 ? minutes + " min" : `${Math.floor(minutes / 60)} h ${minutes % 60} min`;
}
const when = (time) => new Date(time).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const plural = (count, word) => `${count.toLocaleString()} ${word}${count === 1 ? "" : "s"}`;
function settings(s) {
  if (!s) return "";
  const parts = [s.resolution === "keep" ? "original size" : s.resolution === "2160" ? "4K" : s.resolution + "p",
    s.fps === "keep" ? "original frame rate" : s.fps + " fps", s.codec === "h264" ? "H.264" : "HEVC", s.quality];
  return parts.join(", ");
}
function tile(label, value, note) {
  return el("div", { className: "tile" }, [
    el("div", { className: "label", textContent: label }), el("div", { className: "value", textContent: value }),
    el("div", { className: "note", textContent: note }),
  ]);
}
function table(headers, rows) {
  return el("div", { className: "scroll" }, [el("table", {}, [
    el("thead", {}, [el("tr", {}, headers.map(([text, cls]) => el("th", { textContent: text, className: cls || "" })))]),
    el("tbody", {}, rows),
  ])]);
}
const cell = (text, className = "") => el("td", { textContent: text, className });

function render(data) {
  const events = data.events;
  const shrinks = events.filter((e) => e.type === "shrink");
  const done = shrinks.filter((e) => e.outcome === "done");
  const deletes = events.filter((e) => e.type === "delete");
  if (!events.length) {
    return [el("div", { className: "empty", textContent: "Nothing here yet. Shrink or delete something in the library and it will show up on this page." })];
  }

  const deletedItems = deletes.flatMap((e) => e.items || []);
  const deletedIds = new Set(deletedItems.map((item) => item.id));
  // Something counts as gone if this app deleted it, or if the measured library no longer has it.
  const gone = (id, exists) => deletedIds.has(id) || (data.ready && !exists);

  // Each finished shrink lands in one of three places. Its copy replaced the original: that is space
  // saved by shrinking. Both are still in the library: the copy is extra until the original goes.
  // The copy itself was deleted: it added nothing, and its original counts as a plain deletion if it went too.
  const replaced = [], waiting = [], credited = new Set(), copyIds = new Set();
  for (const e of done) {
    copyIds.add(e.newId);
    if (gone(e.newId, e.copyExists)) continue;
    if (gone(e.assetId, e.originalExists) && !credited.has(e.assetId)) {
      credited.add(e.assetId);
      replaced.push(e);
    } else {
      waiting.push(e);
    }
  }
  const sum = (list, pick) => list.reduce((total, x) => total + pick(x), 0);
  const shrunkBefore = sum(replaced, (e) => e.originalBytes), shrunkAfter = sum(replaced, (e) => e.newBytes);
  const savedByShrinking = shrunkBefore - shrunkAfter;
  // Everything deleted that wasn't an original replaced by a smaller copy, or a smaller copy itself.
  const outright = deletedItems.filter((item) => !credited.has(item.id) && !copyIds.has(item.id));
  const savedByDeleting = sum(outright, (item) => item.bytes);
  const waitingCopies = sum(waiting, (e) => e.newBytes);
  const waitingBytes = sum(waiting.filter((e) => e.originalExists), (e) => e.originalBytes);
  const net = savedByShrinking + savedByDeleting - waitingCopies;

  const parts = [
    ...(replaced.length ? [`${size(savedByShrinking)} from shrinking ${plural(replaced.length, "video")}`] : []),
    ...(outright.length ? [`${size(savedByDeleting)} from deleting ${plural(outright.length, "item")} outright`] : []),
  ];
  const hero = el("div", { className: "hero" }, [
    el("div", { className: "label", textContent: net >= 0 ? "Space saved so far" : "Library has grown by" }),
    el("div", { className: "value", textContent: size(net) }),
    el("div", { className: "note", textContent:
      (parts.length ? parts.join(", plus ") + ". " : "") +
      (waiting.length ? `${plural(waiting.length, "smaller copy").replace("copys", "copies")} (${size(waitingCopies)}) ${waiting.length === 1 ? "sits" : "sit"} next to ${waiting.length === 1 ? "its original" : "their originals"} for now; deleting ${waiting.length === 1 ? "that original" : "those originals"} would save another ${size(waitingBytes)}. ` : "") +
      "Deleted items sit in Recently Deleted for 30 days, and iCloud space is freed when they leave it." }),
  ]);

  const outcomes = ["done", "failed", "skipped", "cancelled"].map((o) => [o, shrinks.filter((e) => e.outcome === o).length]).filter(([, n]) => n);
  const tiles = el("div", { className: "tiles" }, [
    tile("Saved by shrinking", size(savedByShrinking), replaced.length ? `${plural(replaced.length, "video")}: ${size(shrunkBefore)} → ${size(shrunkAfter)}` : "No originals replaced yet"),
    tile("Saved by deleting", size(savedByDeleting), outright.length ? plural(outright.length, "item") + " deleted outright" : "Nothing deleted outright"),
    tile("Ready to free", size(waitingBytes), waiting.length ? plural(waiting.length, "original") + " with a smaller copy" : "No originals waiting"),
    tile("Shrink attempts", shrinks.length.toLocaleString(), outcomes.map(([o, n]) => `${n} ${o === "done" ? "completed" : o}`).join(", ") || "None yet"),
  ]);

  const sections = [hero, tiles];
  if (!data.ready) sections.push(el("p", { className: "muted", textContent: "Still measuring the library, so whether originals are still present may be out of date for a minute." }));

  // One table for every attempt, so it's plain which ones finished and which didn't.
  if (shrinks.length) {
    const results = { done: "✓ Completed", failed: "✕ Failed", skipped: "Skipped", cancelled: "Cancelled" };
    sections.push(el("h2", { textContent: "Shrink attempts" }),
      el("p", { className: "muted caption", textContent: "Completed means a smaller copy was added to Photos. Anything else left the library untouched." }),
      table(
      [["When"], ["Video"], ["Result"], ["Size before and after"], ["Saved", "number"], ["Original"], ["Time taken"], ["Settings"]],
      [...shrinks].reverse().map((e) => {
        const finished = e.outcome === "done";
        const share = finished && e.originalBytes ? e.newBytes / e.originalBytes : 0;
        const result = el("td", { className: "result" }, [
          el("div", { className: "outcome " + e.outcome, textContent: results[e.outcome] || e.outcome }),
          ...(!finished && e.message ? [el("div", { className: "muted reason", textContent: e.message })] : []),
        ]);
        const taken = [e.downloadSeconds ? span(e.downloadSeconds) + " download" : "", e.encodeSeconds ? span(e.encodeSeconds) + " encode" : ""].filter(Boolean).join(", ");
        if (!finished) {
          return el("tr", { className: "unfinished" }, [
            cell(when(e.time), "when"), cell(e.name, "name"), result, cell(size(e.originalBytes) + ", unchanged"),
            cell("", "number"), cell(""), cell(taken), cell(settings(e.settings)),
          ]);
        }
        const original = !e.copyExists ? "Smaller copy deleted" : e.originalExists ? "Still in the library" : "Deleted";
        // Only items still in the library can be shown in Photos, and an original is only offered for
        // deletion while its smaller copy is still there to take its place.
        const remove = el("button", { className: "danger", textContent: "Delete original" });
        remove.onclick = () => deleteOriginal(e, remove);
        const links = el("div", { className: "links" }, [
          ...(e.copyExists ? [photosButton("Open copy in Photos", e.newId)] : []),
          ...(e.originalExists ? [photosButton("Open original in Photos", e.assetId)] : []),
          ...(e.originalExists && e.copyExists ? [remove] : []),
        ]);
        return el("tr", {}, [
          cell(when(e.time), "when"), el("td", { className: "name" }, [el("div", { textContent: e.name }), links]), result,
          cell(`${size(e.originalBytes)} → ${size(e.newBytes)}`, "sizes"),
          cell(`${size(e.originalBytes - e.newBytes)} (${Math.round(100 * (1 - share))}%)`, "number"),
          cell(original), cell(taken), cell(settings(e.settings)),
        ]);
      })));
  }
  if (deletes.length) {
    sections.push(el("h2", { textContent: "Deletions" }), table(
      [["When"], ["Items"], ["Size", "number"]],
      [...deletes].reverse().map((e) => {
        const items = e.items || [];
        const names = items.slice(0, 3).map((item) => item.name).join(", ") + (items.length > 3 ? ` and ${items.length - 3} more` : "");
        return el("tr", {}, [cell(when(e.time), "when"), cell(`${plural(items.length, "item")}: ${names}`, "name"),
          cell(size(items.reduce((sum, item) => sum + item.bytes, 0)), "number")]);
      })));
  }
  return sections;
}

let last = "";
async function refresh() {
  clearTimeout(refresh.timer);
  try {
    const text = await (await fetch("/api/stats")).text();
    // Only redraw when something changed, so text stays selectable between refreshes.
    if (text !== last) {
      last = text;
      $("content").replaceChildren(...render(JSON.parse(text)));
    }
  } catch (error) {
    if (!last) $("content").replaceChildren(el("p", { className: "muted", textContent: "Photo Review isn't responding. Open the app, then reload this page." }));
  }
  refresh.timer = setTimeout(refresh, 5000);
}
refresh();
</script>
</body>
</html>
